services:

  # Banco de dados MySQL
  mysql:
    image: mysql:8.0
    container_name: todolist-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: todolist
    ports:
      # Porta 3307 na maquina para nao conflitar com um MySQL ja instalado
      - "3307:3306"
    volumes:
      # Todo arquivo .sql colocado nesta pasta e executado automaticamente
      # na primeira vez que o banco sobe (cria as tabelas e os dados iniciais)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      # O MySQL demora alguns segundos ate aceitar conexoes.
      # Este teste avisa ao Docker quando ele realmente esta pronto.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/todolist?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
    depends_on:
      mysql:
        condition: service_healthy

  app:
    build: ./tarefas
    ports:
      - "8080:8080"
    environment:
      API_URL: http://api:8080
    depends_on:
      - api

volumes:
  mysql_data:
